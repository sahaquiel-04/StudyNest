<ion-header collapse="fade" class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>

    <!--Search Button-->
    <ion-buttons slot="end" class="search-container">
      <ion-button (click)="openNotifications()" class="search-btn">
        <ion-icon slot="icon-only" src="assets/search.svg" class="notification-icon"></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- Notification button -->
    <ion-buttons slot="end" class="notification-container">
      <ion-button (click)="openNotifications()" class="notification-btn">
        <ion-icon slot="icon-only" src="assets/bell.svg" class="notification-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-router-outlet></ion-router-outlet>
</ion-content>

<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" src="assets/home.svg"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" src="assets/class.svg"></ion-icon>
      <ion-label>Classes</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" src="assets/chat.svg"></ion-icon>
      <ion-label>Chat</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<!-- FAB with expanding list -->
<ion-fab vertical="bottom" horizontal="end" slot="fixed" style="margin-bottom: 60px;">
  <ion-fab-button>
    <ion-icon src="assets/add.svg"></ion-icon>
  </ion-fab-button>
  
  <ion-fab-list side="top">
    <ion-fab-button color="primary" (click)="joinClass()">
      <ion-icon name="people-outline"></ion-icon>
    </ion-fab-button>
    <ion-fab-button color="primary" (click)="createClass()">
      <ion-icon name="create-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>
